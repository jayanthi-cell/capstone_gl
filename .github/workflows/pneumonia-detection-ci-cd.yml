
name: Pneumonia Detection CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate-app:
    name: Validate Backend and Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required files exist
        run: |
          test -f app.py
          test -f preprocessing.py
          test -f requirements.txt
          test -f Dockerfile
          test -f model/pneumonia_detection_vgg16_v1_0.keras
          echo "All required deployment files are present."

      - name: Compile Python files
        run: |
          python -m py_compile app.py
          python -m py_compile preprocessing.py

  build-docker:
    name: Build Docker Image
    needs: validate-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: pneumonia-detection-app:latest

  push-docker:
    name: Push Docker Image to GHCR
    needs: build-docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pneumonia-detection-app:latest
            ghcr.io/${{ github.repository_owner }}/pneumonia-detection-app:${{ github.sha }}
